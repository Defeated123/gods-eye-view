# nginx reverse proxy for the Base44 preview.
# Forwards host port 3000 to the Vite dev server on :4173, strips the dev
# server's frame-blocking headers so the preview iframe can embed the page,
# and proxies websocket upgrades for Vite HMR.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000;
    server_name _;

    client_max_body_size 50m;

    location / {
        proxy_pass http://web:4173;
        proxy_http_version 1.1;

        # WebSocket / HMR upgrade support.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived connections for HMR / SSE streams.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # The Vite dev server sets these to prevent clickjacking on a real
        # deployment; the Base44 preview is itself an iframe, so drop them.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }
}
